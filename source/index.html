<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cineplex | Premium Cinema Booking</title>
    <meta
      name="description"
      content="Cineplex - single-page cinema booking system built with HTML, JavaScript and SQL (SQLite). DBMS Lab Project."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%2309090c%27/%3E%3Cpath d=%27M9 7.5v9l7.5-4.5z%27 fill=%27%23d9b45a%27/%3E%3C/svg%3E"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M10 9.5v5l4.5-2.5z" />
          </svg>
        </div>
        <h1>CINEPLEX</h1>
        <div class="orn"><i></i>◆<i></i></div>
      </header>
      <div id="msg"></div>
      <div class="card"><div class="sum" id="summary"></div></div>
      <div class="card" id="s-now">
        <h2>Now Showing</h2>
        <div class="tabs">
          <button class="g sm on" data-k="">All</button><button class="g sm" data-k="Movie">Movies</button
          ><button class="g sm" data-k="Series">Series</button>
        </div>
        <div class="shows" id="shows"></div>
      </div>

      <div class="card" id="s-book">
        <h2 id="ft">New Booking</h2>
        <form id="f" class="grid">
          <input type="hidden" id="id" />
          <label>Show<select id="show" required></select></label>
          <label
            >Customer name<input id="name" maxlength="80" placeholder="e.g. Tasmia Tahsin" required
          /></label>
          <label>Phone<input id="phone" maxlength="20" placeholder="e.g. 01711000000" required /></label>
          <label>Seats<input id="seats" readonly placeholder="Pick on the seat map" /></label>
          <div>
            <button id="sb">Book</button>
            <button type="button" class="g" id="cx" style="display: none">Cancel</button>
          </div>
        </form>
        <div id="calc" class="how" style="margin: 16px 0 0; color: #f3dc9a"></div>
        <div id="map"></div>
      </div>

      <div class="card" id="s-list">
        <h2>All Bookings</h2>
        <div class="grid" style="margin-bottom: 14px">
          <label>Search name or phone<input id="q" placeholder="e.g. Noha" /></label>
          <label>Filter by show<select id="fshow"></select></label>
          <div><button class="g" id="rs">Reset</button> <button class="g" id="csv">Export CSV</button></div>
        </div>
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Customer</th>
                <th>Show</th>
                <th>Seats</th>
                <th>Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="s-rev">
        <h2>Revenue by Title</h2>
        <div id="chart"></div>
      </div>
      <details class="card" id="s-sql">
        <summary>Last SQL query executed</summary>
        <pre id="sqlbox" style="margin-top: 14px">-</pre>
        <p style="text-align: right; margin: 12px 0 0">
          <button class="g sm" id="resetdb">Reset demo data</button>
        </p>
      </details>

      <div id="ticket" onclick="if (event.target === this) this.style.display = 'none';">
        <div id="tk"></div>
      </div>
    </div>
    <script src="js/lib/sql-wasm.js"></script>
    <script src="js/lib/sql-wasm-data.js"></script>
    <script src="js/schema.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
